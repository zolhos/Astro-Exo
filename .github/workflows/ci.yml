name: Astro-Exo CI / CD & Scientific Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Pip & Core Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Astro-Exo & Scientific Dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Verify CLI Entrypoint & Version
        run: |
          astro-exo --version
          astro-exo --help

      - name: Execute Full Astro-Exo Smoke Diagnostics
        run: |
          astro-exo smoke

      - name: Execute Automated Scientific Test Suite (37 Tests)
        run: |
          python -m unittest discover tests

      - name: Verify Ergonomic Subcommands (Joint-RV & Dashboard)
        run: |
          astro-exo joint-rv --demo --outdir ./ci_rv_out
          astro-exo dashboard --results-dir results/rodada_amostras_ineditas --output ./ci_dashboard.html

  build-and-package:
    name: Package Build & Wheel Verification (PEP 517 / 621)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packaging Utilities
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Verify Package Metadata & Distribution Integrity
        run: |
          python -m twine check dist/*

      - name: Archive Built Packages
        uses: actions/upload-artifact@v4
        with:
          name: astro-exo-v1.0.0-dist
          path: dist/
